      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="45" y1="10" x2="55" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Squircle with Subtle Border -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

